name: Terraform Apply

on:
  push:
    branches:
    - main
    paths:
    - '**/*.tf'
    - '**/*.tfvars'
    - '.terraform.lock.hcl'
    - '.github/workflows/terraform-apply.yaml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-deploy
  cancel-in-progress: false

jobs:
  terraform-apply:
    runs-on: ubuntu-latest
    environment: production
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Get token
      id: get_token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        private-key: ${{ secrets.TERRAFORM_APP_PRIVATE_KEY }}
        client-id: ${{ secrets.TERRAFORM_APP_CLIENT_ID }}
        owner: msdeleyto

    - name: Configure AWS credentials
      id: aws-credentials
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: us-east-1
        role-session-name: GitHubActions-Terraform-Github
        mask-aws-account-id: true

    - name: Mask AWS account ID
      shell: bash
      run: echo "::add-mask::${{ steps.aws-credentials.outputs.aws-account-id }}"

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: "1.15.9"

    - name: Terraform Init
      id: init
      shell: bash
      run: terraform init

    - name: Terraform Plan
      id: plan
      shell: bash
      run: terraform plan -out=tfplan -no-color 2>&1
      env:
        GITHUB_TOKEN: ${{ steps.get_token.outputs.token }}

    - name: Terraform Plan Status
      shell: bash
      if: steps.plan.outcome == 'failure'
      run: exit 1

    - name: Terraform Apply
      id: apply
      shell: bash
      run: terraform apply -auto-approve tfplan
      env:
        GITHUB_TOKEN: ${{ steps.get_token.outputs.token }}

    - name: Deployment Summary
      shell: bash
      if: always()
      run: |
        echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Step | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Plan | ${{ steps.plan.outcome }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Apply | ${{ steps.apply.outcome }} |" >> $GITHUB_STEP_SUMMARY
